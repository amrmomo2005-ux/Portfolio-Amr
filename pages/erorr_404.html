    <!-- الفاصل السفلي الخفيف أو المساحة الهوائية لإنهاء التصميم بشكل راقٍ -->

    <!-- كود جافا سكريبت لتشغيل تأثير الـ 3D Parallax ومينو الموبايل -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // تفعيل قائمة الهاتف
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');

            mobileBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                const icon = mobileBtn.querySelector('i');
                if (mobileMenu.classList.contains('hidden')) {
                    icon.className = 'fa-solid fa-bars';
                } else {
                    icon.className = 'fa-solid fa-xmark';
                }
            });

            // تفعيل القائمة الفرعية لـ Work على الموبايل
            const mobileWorkBtn = document.getElementById('mobile-work-btn');
            const mobileWorkSubmenu = document.getElementById('mobile-work-submenu');
            const mobileWorkArrow = document.getElementById('mobile-work-arrow');

            if (mobileWorkBtn && mobileWorkSubmenu) {
                mobileWorkBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    mobileWorkSubmenu.classList.toggle('hidden');
                    mobileWorkSubmenu.classList.toggle('flex');
                    mobileWorkArrow.classList.toggle('rotate-180');
                });
            }

            // تأثير حركي تفاعلي خفيف وفخم جداً مع الماوس للصورة (3D Parallax Tilt)
            const heroBox = document.getElementById('interactive-404-box');
            const heroImg = document.getElementById('img-404');

            if (heroBox && heroImg) {
                heroBox.addEventListener('mousemove', (e) => {
                    const rect = heroBox.getBoundingClientRect();
                    
                    // حساب موضع مؤشر الماوس بالنسبة لمنتصف الصورة
                    const x = e.clientX - rect.left - (rect.width / 2);
                    const y = e.clientY - rect.top - (rect.height / 2);

                    // تحويل الموضع لزاوية ميلان واقعية وناعمة للغاية
                    const rotateX = -(y / (rect.height / 2)) * 8; // ميلان رأسي بحد أقصى 8 درجات
                    const rotateY = (x / (rect.width / 2)) * 10;  // ميلان أفقي بحد أقصى 10 درجات

                    // تطبيق التحويل مع إزاحة خفيفة لليمين واليسار
                    heroImg.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                });

                // إعادة الصورة لوضعها المستقر والناعم عند خروج الماوس
                heroBox.addEventListener('mouseleave', () => {
                    heroImg.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
                    heroImg.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                });

                heroBox.addEventListener('mouseenter', () => {
                    heroImg.style.transition = 'transform 0.1s ease-out';
                });
            }
        });
    </script>
